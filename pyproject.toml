[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario-tts"
version = "0.1.0"
description = "Scenario-directed English batch speech with Qwen3-TTS and reproducible audio mixing"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "soundfile>=0.12,<1",
    "gradio>=6,<7",
]

[project.optional-dependencies]
tts = ["qwen-tts==0.1.1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
scenario-tts = "scenario_tts.cli:main"

[tool.setuptools.packages.find]
include = ["scenario_tts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
